# =============================================================================
# Contents Researcher - Docker Compose 설정
# =============================================================================
# 전체 서비스 일괄 실행: docker compose up -d
# 종료: docker compose down
# 데이터 초기화 포함 종료: docker compose down -v
# 로그 확인: docker compose logs -f
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB (PostgreSQL 16 기반 시계열 데이터베이스)
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: cr_timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: contents_researcher
      POSTGRES_USER: cr_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cr_user -d contents_researcher"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis (캐시 + 작업 큐 + 중복 체크)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 백엔드 API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cr_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cr_user:${DB_PASSWORD:-password}@db:5432/contents_researcher
      REDIS_URL: redis://redis:6379/0
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/'); assert r.status_code==200"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 프론트엔드 (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: cr_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_HOST: backend
    depends_on:
      backend:
        condition: service_healthy

# =============================================================================
# Docker 볼륨
# =============================================================================
volumes:
  pgdata:
  redisdata:
