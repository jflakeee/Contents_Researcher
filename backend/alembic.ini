# Alembic 설정 파일
# sqlalchemy.url은 env.py에서 동적으로 설정하므로 여기서는 빈 값을 둔다.

[alembic]
# 마이그레이션 스크립트 경로
script_location = alembic

# 데이터베이스 URL (env.py에서 config.py의 값으로 덮어씀)
sqlalchemy.url =

# 마이그레이션 파일명 템플릿
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 타임존 설정
timezone = Asia/Seoul

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
